<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Metadata Generator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      color: #d1d5db;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #9ca3af;
      border-radius: 15px;
      padding: 50px 20px;
      text-align: center;
    }

    .upload-box h2 {
      margin-bottom: 10px;
    }

    .upload-box p {
      color: #6b7280;
      margin-bottom: 20px;
    }

    input[type="file"] {
      margin: 15px 0;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #374151;
    }

    #preview {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .image-card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .image-card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 8px;
    }

    .image-card p {
      margin-top: 8px;
      font-size: 13px;
      word-break: break-word;
    }

    .status {
      margin-top: 25px;
      text-align: center;
      font-weight: bold;
    }

    #results {
      margin-top: 30px;
    }

    .result-card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .result-card h3 {
      margin-bottom: 10px;
    }

    .result-card pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #f3f4f6;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

<header>
  <h1>AI Metadata Generator</h1>
  <p>Generate AI metadata for your images</p>
</header>

<div class="container">

  <div class="upload-box">

    <h2>Upload Your Images</h2>

    <p>
      Select one image first for our AI connection test.
    </p>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      multiple
    >

    <br>

    <button onclick="analyzeImages()">
      Generate Metadata
    </button>

  </div>

  <div class="status" id="status"></div>

  <div id="preview"></div>

  <div id="results"></div>

</div>

<script>

const WORKER_URL =
  "https://ai-metadata-api.safil19704.workers.dev/";

async function analyzeImages() {

  const input = document.getElementById("imageInput");
  const preview = document.getElementById("preview");
  const results = document.getElementById("results");
  const status = document.getElementById("status");

  preview.innerHTML = "";
  results.innerHTML = "";

  if (input.files.length === 0) {

    status.textContent = "Please select an image first.";
    return;

  }

  status.textContent =
    "Processing " + input.files.length + " image(s)...";

  for (let i = 0; i < input.files.length; i++) {

    const file = input.files[i];

    const card = document.createElement("div");
    card.className = "image-card";

    const img = document.createElement("img");

    img.src = URL.createObjectURL(file);

    const name = document.createElement("p");

    name.textContent = file.name;

    card.appendChild(img);
    card.appendChild(name);

    preview.appendChild(card);

    try {

      const imageData = await fileToDataURL(file);

      const response = await fetch(WORKER_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          image: imageData
        })

      });

      const data = await response.json();

      const resultCard =
        document.createElement("div");

      resultCard.className = "result-card";

      const title =
        document.createElement("h3");

      title.textContent =
        "AI Result: " + file.name;

      const result =
        document.createElement("pre");

      result.textContent =
        JSON.stringify(data, null, 2);

      resultCard.appendChild(title);
      resultCard.appendChild(result);

      results.appendChild(resultCard);

    } catch (error) {

      const errorCard =
        document.createElement("div");

      errorCard.className = "result-card";

      errorCard.innerHTML =
        "<h3>Error: " +
        file.name +
        "</h3><p>" +
        error.message +
        "</p>";

      results.appendChild(errorCard);

    }

  }

  status.textContent =
    "Processing finished.";

}


function fileToDataURL(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () =>
      resolve(reader.result);

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}

</script>

</body>
</html>
