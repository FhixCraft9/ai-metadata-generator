<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Metadata Generator</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      color: #d1d5db;
    }

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 20px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #9ca3af;
      border-radius: 16px;
      padding: 45px 20px;
      text-align: center;
    }

    .upload-box h2 {
      margin-bottom: 10px;
    }

    .upload-box p {
      color: #6b7280;
      margin-bottom: 20px;
    }

    input[type="file"] {
      margin: 20px 0;
      max-width: 100%;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      padding: 13px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #374151;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin: 25px 0;
      text-align: center;
      font-weight: bold;
    }

    #preview {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(220px, 1fr)
      );
      gap: 20px;
    }

    .image-card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .image-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    .image-card p {
      margin-top: 8px;
      font-size: 13px;
      word-break: break-word;
    }

    #results {
      margin-top: 35px;
    }

    .result-card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .result-card h3 {
      margin-bottom: 12px;
    }

    .result-card pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #f3f4f6;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
    }

    .success {
      color: #166534;
    }

    .error {
      color: #b91c1c;
    }

  </style>
</head>

<body>

<header>

  <h1>AI Metadata Generator</h1>

  <p>
    Generate AI-powered metadata for your images
  </p>

</header>


<div class="container">

  <div class="upload-box">

    <h2>Upload Your Images</h2>

    <p>
      Select one or more images to generate metadata.
    </p>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      multiple
    >

    <br>

    <button
      id="generateButton"
      onclick="analyzeImages()"
    >
      Generate Metadata
    </button>

  </div>


  <div
    class="status"
    id="status"
  ></div>


  <div id="preview"></div>


  <div id="results"></div>

</div>


<script>


const WORKER_URL =
  "https://ai-metadata-api.safil19704.workers.dev/";


const MAX_IMAGE_SIZE = 1200;


const input =
  document.getElementById("imageInput");


const preview =
  document.getElementById("preview");


const results =
  document.getElementById("results");


const status =
  document.getElementById("status");


const generateButton =
  document.getElementById("generateButton");



input.addEventListener(
  "change",
  previewImages
);



function previewImages() {

  preview.innerHTML = "";

  const files = input.files;

  if (!files.length) {
    return;
  }

  for (const file of files) {

    const card =
      document.createElement("div");

    card.className =
      "image-card";


    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(file);


    const name =
      document.createElement("p");

    name.textContent =
      file.name;


    card.appendChild(img);

    card.appendChild(name);

    preview.appendChild(card);

  }

}



async function analyzeImages() {

  const files =
    input.files;


  if (!files.length) {

    status.textContent =
      "Please select at least one image.";

    status.className =
      "status error";

    return;

  }


  generateButton.disabled =
    true;


  results.innerHTML =
    "";


  status.textContent =
    "Preparing images...";

  status.className =
    "status";


  let completed = 0;


  for (const file of files) {

    try {

      status.textContent =
        `Processing ${completed + 1} of ${files.length}: ${file.name}`;


      const imageData =
        await resizeAndCompress(file);


      const response =
        await fetch(
          WORKER_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              image: imageData
            })
          }
        );


      const data =
        await response.json();


      const card =
        document.createElement("div");


      card.className =
        "result-card";


      const title =
        document.createElement("h3");


      title.textContent =
        file.name;


      const result =
        document.createElement("pre");


      result.textContent =
        JSON.stringify(
          data,
          null,
          2
        );


      card.appendChild(title);

      card.appendChild(result);

      results.appendChild(card);


      completed++;


    } catch (error) {

      const card =
        document.createElement("div");


      card.className =
        "result-card";


      card.innerHTML =
        `
        <h3>${file.name}</h3>

        <p class="error">
          Error: ${error.message}
        </p>
        `;


      results.appendChild(card);

      completed++;

    }

  }


  status.textContent =
    `Finished: ${completed} image(s) processed.`;


  status.className =
    "status success";


  generateButton.disabled =
    false;

}



function resizeAndCompress(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const img =
            new Image();


          img.onload =
            function() {

              let width =
                img.width;


              let height =
                img.height;


              if (
                width > MAX_IMAGE_SIZE ||
                height > MAX_IMAGE_SIZE
              ) {

                if (
                  width > height
                ) {

                  height =
                    Math.round(
                      height *
                      MAX_IMAGE_SIZE /
                      width
                    );

                  width =
                    MAX_IMAGE_SIZE;

                } else {

                  width =
                    Math.round(
                      width *
                      MAX_IMAGE_SIZE /
                      height
                    );

                  height =
                    MAX_IMAGE_SIZE;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;


              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const compressed =
                canvas.toDataURL(
                  "image/jpeg",
                  0.70
                );


              resolve(compressed);

            };


          img.onerror =
            function() {

              reject(
                new Error(
                  "Could not read image."
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Could not load file."
            )
          );

        };


      reader.readAsDataURL(file);

    }
  );

}


</script>

</body>
</html>
